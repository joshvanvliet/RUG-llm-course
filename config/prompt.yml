  I am struggling to estimate what emotion I should say for the line. Please help me. The line is {{insert}}. 
  Please report which emotion combinations I should act in from the following list: 
    anger, anticipation, disgust, fear, joy, sadness, surprise, trust. 
    Only mention the emotion that you think the line expresses.
