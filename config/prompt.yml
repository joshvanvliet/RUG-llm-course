  The possible emotions are: anger:1, anticipation:2, disgust:3, fear:4, joy:5, sadness:6, surprise:7, trust:8. 
  Each sentence may have multiple emotions. You must output your prediction in the format of [number of emotion, number of emotion, ...]. 
  With these instructions please evaluate this sentence: {{insert}}.

conversation: >
